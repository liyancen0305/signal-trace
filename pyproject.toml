[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-trace"
version = "0.1.0"
description = "Synthetic incident investigation evidence for Signal Trace"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.10,<5"]

[tool.setuptools.packages.find]
include = ["signal_trace*"]
