[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-trace"
version = "0.1.0"
description = "Synthetic incident investigation evidence for Signal Trace"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.10,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["signal_trace*"]
